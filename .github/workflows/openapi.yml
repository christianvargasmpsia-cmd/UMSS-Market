name: Demo 2 - recommendations and OpenAPI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: umss_recommendations_test
          POSTGRES_USER: demo
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U demo -d umss_recommendations_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEMO_POSTGRES_URL: jdbc:postgresql://localhost:5432/umss_recommendations_test
      DEMO_POSTGRES_USER: demo
      DEMO_POSTGRES_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/demos/tools/package-lock.json
      - name: Tests H2, PostgreSQL, JWT and generated OpenAPI
        working-directory: backend/umss-market-api
        run: >-
          mvn -B
          -Dtest=RecommendationsUnitTest,RecommendationsIntegrationTest,RecommendationsPostgresTest,OllamaRecommendationAdapterTest,RedTeamSecurityTest,AIServiceImplTest,OpenApiContractTest
          -Djacoco.append=false test jacoco:report
      - name: Reject contract drift
        run: |
          node docs/demos/check-openapi.cjs
          node docs/demos/check-openapi.cjs backend/umss-market-api/target/openapi.json ai-testing-agent/collections/umss-market-openapi.json
      - name: Install pinned Spectral
        run: npm ci --prefix docs/demos/tools
      - name: Spectral (errors fail; documentation warnings allowed)
        run: >-
          node docs/demos/tools/node_modules/@stoplight/spectral-cli/dist/index.js
          lint openapi.json --ruleset .spectral.yaml --fail-severity error
          --format json --output backend/umss-market-api/target/spectral.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo2-evidence
          path: |
            backend/umss-market-api/target/openapi.json
            backend/umss-market-api/target/spectral.json
            backend/umss-market-api/target/surefire-reports/
            backend/umss-market-api/target/site/jacoco/
