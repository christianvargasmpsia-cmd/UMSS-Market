spring.application.name=umss-market-api

spring.datasource.url=jdbc:postgresql://localhost:5432/umss_market_redteam

spring.datasource.username=postgres

spring.datasource.password=postgres123


spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

server.port=8080

logging.level.org.springframework.security=DEBUG

ia.enabled=${IA_HABILITADA:true}

app.db.seed.enabled=false

app.jwt.secret=umss-market-secret-key-for-jwt-authentication-2026

# ==========================================
# MONITOREO DE IA - EVALS EN LINEA
# ==========================================

ai.monitoring.enabled=true

# Version funcional del asistente evaluado.
# No representa la version del modelo Ollama.
ai.monitoring.version=m7-v1

# Archivo JSONL donde se registra una linea por interaccion.
ai.monitoring.log-path=logs/ai-monitoring.jsonl
# Explicacion de recomendaciones: modelo pequeno, una llamada por solicitud.
recommendations.ollama.base-url=${RECOMMENDATIONS_OLLAMA_BASE_URL:http://localhost:11434}
recommendations.ollama.model=${RECOMMENDATIONS_OLLAMA_MODEL:qwen2.5:1.5b}
recommendations.ollama.timeout-ms=${RECOMMENDATIONS_OLLAMA_TIMEOUT_MS:20000}

# Resumen extractivo de resenas - generacion local en CPU
reviews.ollama.base-url=${REVIEWS_OLLAMA_BASE_URL:http://localhost:11434}
reviews.ollama.model=${REVIEWS_OLLAMA_MODEL:qwen2.5:1.5b}
reviews.ollama.timeout-ms=${REVIEWS_OLLAMA_TIMEOUT_MS:45000}

duplicates.threshold=${DUPLICATES_THRESHOLD:0.90}
duplicates.max-results=${DUPLICATES_MAX_RESULTS:5}
duplicates.ollama.base-url=${DUPLICATES_OLLAMA_BASE_URL:http://localhost:11434}
duplicates.ollama.model=${DUPLICATES_OLLAMA_MODEL:nomic-embed-text}
duplicates.ollama.timeout-ms=${DUPLICATES_OLLAMA_TIMEOUT_MS:45000}
